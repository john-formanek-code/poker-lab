[project]
name = "unified-card-games"
version = "0.1.0"
description = "A unified stack for Blackjack and Poker"
authors = [{ name = "Gemini CLI", email = "gemini@google.com" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0,<3",
    "pylint>=3.0.3,<4",
    "pyglet==1.5.15",
    "pybind11>=2.11.1,<3",
    "cppimport>=22.8.2,<23",
    "docopt>=0.6.2,<0.7",
    "pydocstyle>=6.3.0,<7",
    "matplotlib>=3.8.2,<4",
    "mpld3>=0.5.10,<0.6",
    "setuptools>=80.9.0",
    "gym>=0.26.2",
    "PySide6>=6.0.0",
]

[project.scripts]
gaming-system = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["engines", "ui", "common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
